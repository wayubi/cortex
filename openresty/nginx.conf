lua_shared_dict backend_state 1m;
lua_shared_dict request_counts 1m;

# Let coordinator.lua notice a client that hangs up while its request is parked
# in drain_backend's sleep loop. Without this, a client-side timeout shorter
# than DRAIN_TIMEOUT leaves a dead request holding its in-flight count, which
# blocks the next model switch for the full drain window.
lua_check_client_abort on;

resolver 127.0.0.11 ipv6=off;

server {
    listen 11434;

    location / {
        set $ollama_upstream "http://ollama:11434";
        access_by_lua_file  /etc/nginx/lua/coordinator.lua;

        proxy_pass          $ollama_upstream;
        proxy_http_version  1.1;
        proxy_buffering     off;
        proxy_set_header    Host $host;
        proxy_set_header    Connection '';
        proxy_read_timeout  600s;
        proxy_send_timeout  600s;
    }

    log_by_lua_block {
        if ngx.ctx.counted then
            local c = ngx.shared.request_counts
            if (c:get("ollama") or 0) > 0 then
                c:incr("ollama", -1, 0)
            end
        end
    }
}

server {
    listen 5002;

    client_max_body_size 8m;

    location / {
        set $nllb_upstream "http://nllb:5002";
        access_by_lua_file  /etc/nginx/lua/coordinator.lua;

        proxy_pass          $nllb_upstream;
        proxy_http_version  1.1;
        proxy_buffering     off;
        proxy_set_header    Host $host;
        proxy_set_header    Connection '';
        proxy_read_timeout  600s;
        proxy_send_timeout  600s;
    }

    log_by_lua_block {
        if ngx.ctx.counted then
            local c = ngx.shared.request_counts
            if (c:get("nllb") or 0) > 0 then
                c:incr("nllb", -1, 0)
            end
        end
    }
}

server {
    listen 8080;

    client_max_body_size 32m;

    # Availability, for schedulers that would rather wait than evict. Exact
    # match, so it never reaches coordinator.lua or llama-cpp: it only reads
    # the two shared dicts the coordinator already maintains. `busy` counts
    # in-flight POSTs (inference) across all three backends — GET probes are
    # not counted — and `model` is what is resident right now, so a caller can
    # also choose work that avoids a reload.
    # Internal only: lets /availability ask llama.cpp what its slots are doing
    # without exposing another public route. Short timeouts — a status answer
    # that blocks is worse than one that says "unknown".
    location = /__slots {
        internal;
        set $slots_upstream "http://llama-cpp:8080/slots";
        proxy_pass              $slots_upstream;
        proxy_connect_timeout   1s;
        proxy_read_timeout      2s;
    }

    location = /availability {
        default_type application/json;
        content_by_lua_block {
            local cjson = require "cjson"
            local state = ngx.shared.backend_state
            local counts = ngx.shared.request_counts
            local in_flight, total = {}, 0
            for _, b in ipairs({ "llama_cpp", "ollama", "nllb" }) do
                local n = counts:get(b) or 0
                in_flight[b] = n
                total = total + n
            end

            -- llama.cpp's own view, when it has one. The in-flight counter only
            -- sees traffic that came through here; /slots also catches work
            -- submitted to llama-cpp directly. Absent, disabled (--no-slots) or
            -- slow, this stays null and the counter decides alone.
            local slots = nil
            local ok_cap, res = pcall(ngx.location.capture, "/__slots")
            if ok_cap and res and res.status == 200 then
                local ok_json, parsed = pcall(cjson.decode, res.body)
                -- Older builds return a bare array, newer ones {"slots": [...]}
                if ok_json and type(parsed) == "table" then
                    local list = parsed
                    if type(parsed.slots) == "table" then list = parsed.slots end
                    if type(list) == "table" and #list > 0 then
                        local processing = 0
                        for _, sl in ipairs(list) do
                            if type(sl) == "table" and
                               (sl.is_processing == true or sl.state == 1 or
                                sl.state == "processing") then
                                processing = processing + 1
                            end
                        end
                        slots = { processing = processing, total = #list }
                    end
                end
            end

            ngx.say(cjson.encode({
                busy      = total > 0 or (slots ~= nil and slots.processing > 0),
                in_flight = in_flight,
                slots     = slots or cjson.null,
                backend   = state:get("backend") or cjson.null,
                model     = state:get("model") or cjson.null,
            }))
        }
    }

    location / {
        set $llamacpp_upstream "http://llama-cpp:8080";
        access_by_lua_file  /etc/nginx/lua/coordinator.lua;

        proxy_pass          $llamacpp_upstream;
        proxy_http_version  1.1;
        proxy_buffering     off;
        proxy_set_header    Host $host;
        proxy_set_header    Connection '';
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    log_by_lua_block {
        if ngx.ctx.counted then
            local c = ngx.shared.request_counts
            if (c:get("llama_cpp") or 0) > 0 then
                c:incr("llama_cpp", -1, 0)
            end
        end
    }
}
