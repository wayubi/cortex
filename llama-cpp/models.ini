; ─────────────────────────────────────────────────────────────
; NVIDIA GeForce RTX 3060 — Optimized
; VRAM = 12288MiB
; ─────────────────────────────────────────────────────────────

; ─────────────────────────────────────────────────────────────
; STRESS-TESTING: Optimizing ubatch-size values. If any model OOMs (out of memory), decrease batch-size and ubatch-size.
; ─────────────────────────────────────────────────────────────

[*]
ngl              = -1
flash-attn       = true
jinja            = true
no-mmap          = true
no-mmproj        = true
mlock            = true
parallel         = 1
cont-batching    = true
threads          = 20
threads-batch    = 20
ctx-size         = 65536
batch-size       = 4096 ; batch-size should equal ubatch-size
ubatch-size      = 4096 ; adjust by 1024 / 512 / 256 / 128 / 64 increments
cache-type-k     = q4_0
cache-type-v     = q4_0

