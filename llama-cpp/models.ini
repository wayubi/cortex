; NVIDIA GeForce RTX 3060 — Optimized
; VRAM = 12288MiB
; ─────────────────────────────────────────────────────────────

; ─────────────────────────────────────────────────────────────
; STRESS-TESTING: Optimizing ubatch-size values. If any model OOMs (out of memory), decrease batch-size and ubatch-size.
