; ─────────────────────────────────────────────────────────────
; inkling-llama-cpp — the llama.cpp build for Thinking Machines' Inkling 2 Mini
; (looped `inkling2` arch in Unsloth's GGUF layout; Unsloth's prebuilt source
; b12588-mix-c0c3de8, pinned by tarball sha256; compose.yml inkling-llama-build).
; Upstream reads only the `inkling2_loop` layout (Mainline_Support/) and gives
; wrong output until ggml-org/llama.cpp#32704 merges, so Inkling has its own
; router. NVIDIA GeForce RTX 3060 — VRAM = 12288MiB
;
; Served on openresty :8080 next to llama-cpp: coordinator.lua sends a request
; here when its model is a section name in THIS file, so every name must be
; unique across every router's models.ini.
; ─────────────────────────────────────────────────────────────

[*]
ngl              = -1
flash-attn       = true
jinja            = true
load-mode        = mmap+mlock
offline          = true
no-mmproj        = true
parallel         = 1
cont-batching    = true
threads          = 20
threads-batch    = 20
ctx-size         = 65536
batch-size       = 4096 ; batch-size should equal ubatch-size
ubatch-size      = 4096 ; adjust by 1024 / 512 / 256 / 128 / 64 increments
cache-type-k     = q4_0
cache-type-v     = q4_0

; ─────────────────────────────────────────────────────────────
; TEST: the shared Q4 weights with the loop layers' experts pinned to the GPU.
; Recipe from David Hatley's 3060 tests (x.com @david_hatley, github
; davidghatley/3060-recipes; IQ4_NL there, 26 t/s at empty ctx in his 128k
; profile — his numbers, not measured here): layers 6-17 run 3x per token, so
; their experts carry ~70% of the bytes read per token. Keep exactly those on
; the GPU, the other layers' experts in RAM. no-op-offload: on master, loop
; experts in RAM + op offload gave NaN for batches >= 32 (his report).
; ubatch 256 (his 128 + q8_0 KV + an F16-mask patch); our q4_0 KV from [*].
; Unmeasured: if it OOMs at load, try 128, or move a loop layer or two to CPU.
; ─────────────────────────────────────────────────────────────

[inkling-2-mini-q4-128k-think-loopgpu]
hf               = unsloth/Inkling-2-Mini-GGUF:UD-Q4_K_XL
override-tensor  = blk\.([0-5]|1[6-9]|2[0-3])\.ffn_.*_exps=CPU
no-op-offload    = true
batch-size       = 192
ubatch-size      = 192
temp             = 1.0
top-p            = 1.0
top-k            = 0
min-p            = 0.00
ctx-size         = 131072

; ─────────────────────────────────────────────────────────────
; 96k clone of the loopgpu entry above with the same weights and sampling:
; only the context and batch are smaller. Do not expect a bench record yet.
; Expert placement follows the GGUF metadata (inkling2.num_loops = 3,
; loop.core_start = 6, loop.core_end = 18): blocks 6-17 are the loop core and
; stay on the GPU; blocks 0-5 and 18-23 go to RAM.
; ─────────────────────────────────────────────────────────────

[inkling-2-mini-q4-96k-think-loopgpu]
hf               = unsloth/Inkling-2-Mini-GGUF:UD-Q4_K_XL
override-tensor  = blk\.([0-5]|1[89]|2[0-3])\.ffn_.*_exps=CPU
no-op-offload    = true
batch-size       = 128
ubatch-size      = 128
temp             = 1.0
top-p            = 1.0
top-k            = 0
min-p            = 0.00
ctx-size         = 98304

; ─────────────────────────────────────────────────────────────
; 64k clone of the loopgpu entries. Same weights, sampling and loop-core
; placement (blocks 6-17 on GPU; 0-5 and 18-23 in RAM); only ctx and batch
; differ. Not saturation-tested.
; ─────────────────────────────────────────────────────────────

[inkling-2-mini-q4-64k-think-loopgpu]
hf               = unsloth/Inkling-2-Mini-GGUF:UD-Q4_K_XL
override-tensor  = blk\.([0-5]|1[89]|2[0-3])\.ffn_.*_exps=CPU
no-op-offload    = true
batch-size       = 192
ubatch-size      = 192
temp             = 1.0
top-p            = 1.0
top-k            = 0
min-p            = 0.00
ctx-size         = 65536
