; ─────────────────────────────────────────────────────────────
; inkling-llama-cpp — the llama.cpp build for Thinking Machines' Inkling 2 Mini
; (looped `inkling2` arch in Unsloth's GGUF layout; Unsloth's prebuilt source
; b12588-mix-c0c3de8, pinned by tarball sha256; compose.yml inkling-llama-build).
; Upstream reads only the `inkling2_loop` layout (Mainline_Support/) and gives
; wrong output until ggml-org/llama.cpp#32704 merges, so Inkling has its own
; router. NVIDIA GeForce RTX 3060 — VRAM = 12288MiB
;
; Served on openresty :8080 next to llama-cpp: coordinator.lua sends a request
; here when its model is a section name in THIS file, so every name must be
; unique across every router's models.ini.
; ─────────────────────────────────────────────────────────────

[*]
ngl              = -1
flash-attn       = true
jinja            = true
load-mode        = mmap+mlock
offline          = true
no-mmproj        = true
parallel         = 1
cont-batching    = true
threads          = 20
threads-batch    = 20
ctx-size         = 65536
batch-size       = 4096 ; batch-size should equal ubatch-size
ubatch-size      = 4096 ; adjust by 1024 / 512 / 256 / 128 / 64 increments
cache-type-k     = q4_0
cache-type-v     = q4_0

; ─────────────────────────────────────────────────────────────
; unsloth/Inkling-2-Mini-GGUF:UD-Q4_K_XL (17.6 GB, imatrix) — 26.2B-A3.4B MoE
; (128 experts, 8 active); layers 6-17 run three times per token (~5.4B
; effective active). Trained context 1,048,576. Text + image (mmproj in the
; repo; this entry loads none — a -vision entry is its own family head).
; Quant: Unsloth's recommended one (their KLD vs Q8_K_XL 0.0107, 98.0% same
; top token; vendor figures, not measured here).
; Sampling: Unsloth's recommended settings (guide, read 2026-11-21: temp 1.0,
; top-p 1.0, top-k 0, min-p 0.0) — vendor values, unmeasured here.
; Thinking: the chat template reads only `reasoning_effort` (none..max or
; 0.0-0.99, default 0.9 "high"), not enable_thinking, so this entry thinks at
; the template default, as Unsloth's own commands do. `reasoning = on/off`
; would not change it; a no-think sibling needs
; chat-template-kwargs = {"reasoning_effort": "none"}.
; batch-size/ubatch-size 2048: a cautious placeholder, NOT measured (no
; bisect). Chosen from the benched CPU-offloaded MoEs at 128k here (picks
; 1664-7616; gpt-oss-20b, also local/global attention, 2112), rounded down
; because Inkling's looped layers and relative-bias attention are untested on
; this card. Run `bench.sh fetch` then `bench.sh all` to replace it.
; ─────────────────────────────────────────────────────────────

[inkling-2-mini-q4-128k-think]
hf               = unsloth/Inkling-2-Mini-GGUF:UD-Q4_K_XL
batch-size       = 512 ; set by hand: 2048 failed at load (13.7 GB compute buffer); decode 5.4 t/s at 1024, 12.4 at 512, 12.7 at 256
ubatch-size      = 512 ; set by hand: 2048 failed at load (13.7 GB compute buffer); decode 5.4 t/s at 1024, 12.4 at 512, 12.7 at 256
temp             = 1.0
top-p            = 1.0
top-k            = 0
min-p            = 0.00
ctx-size         = 131072

; ─────────────────────────────────────────────────────────────
; TEST: the Q4 entry's weights with the loop layers' experts pinned to the GPU.
; Recipe from David Hatley's 3060 tests (x.com @david_hatley, github
; davidghatley/3060-recipes; IQ4_NL there, 26 t/s at empty ctx in his 128k
; profile — his numbers, not measured here): layers 6-17 run 3x per token, so
; their experts carry ~70% of the bytes read per token. Keep exactly those on
; the GPU, the other layers' experts in RAM. no-op-offload: on master, loop
; experts in RAM + op offload gave NaN for batches >= 32 (his report).
; ubatch 256 (his 128 + q8_0 KV + an F16-mask patch); our q4_0 KV from [*].
; Unmeasured: if it OOMs at load, try 128, or move a loop layer or two to CPU.
; ─────────────────────────────────────────────────────────────

[inkling-2-mini-q4-128k-think-loopgpu]
hf               = unsloth/Inkling-2-Mini-GGUF:UD-Q4_K_XL
override-tensor  = blk\.([0-5]|1[6-9]|2[0-3])\.ffn_.*_exps=CPU
no-op-offload    = true
batch-size       = 128
ubatch-size      = 128
temp             = 1.0
top-p            = 1.0
top-k            = 0
min-p            = 0.00
ctx-size         = 131072
