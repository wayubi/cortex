; ─────────────────────────────────────────────────────────────
; flint-llama-cpp — the llama.cpp build for RecursiveSI Flint (arch `flint`,
; upstream b11803+; compose.yml flint-llama-build). llama-cpp's pinned build
; cannot load it, and moving that pin would invalidate the benched catalogue,
; so Flint has its own router. NVIDIA GeForce RTX 3060 — VRAM = 12288MiB
;
; Served on openresty :8080 next to llama-cpp: coordinator.lua sends a request
; here when its model is a section name in THIS file, so every name must be
; unique across llama-cpp/, prism-llama-cpp/ and this models.ini.
; ─────────────────────────────────────────────────────────────

[*]
ngl              = -1
flash-attn       = true
jinja            = true
load-mode        = mmap+mlock
offline          = true
no-mmproj        = true
parallel         = 1
cont-batching    = true
threads          = 20
threads-batch    = 20
ctx-size         = 65536
batch-size       = 4096 ; batch-size should equal ubatch-size
ubatch-size      = 4096 ; adjust by 1024 / 512 / 256 / 128 / 64 increments
cache-type-k     = q4_0
cache-type-v     = q4_0

; ─────────────────────────────────────────────────────────────
; unsloth/flint-GGUF:UD-Q4_K_XL (25.1 GB) — RecursiveSI Flint, 40B-A2.5B MoE
; (256 experts, 6 active + shared), 35 sliding-window (513) + 14 full-attention
; layers, trained ctx 262144. Arch `flint` needs llama.cpp b11803+.
; The chat template has no thinking switch: Flint always reasons, so there
; are only -think entries. Sampling from the model card / generation_config:
; temp 1.0, top-p 0.95, top-k 20, min-p 0.
; ─────────────────────────────────────────────────────────────

[flint-40b-a2.5b-q4-128k-think]
hf               = unsloth/flint-GGUF:UD-Q4_K_XL
batch-size       = 8768
ubatch-size      = 8768
temp             = 1.0
top-p            = 0.95
top-k            = 20
min-p            = 0.00
repeat-penalty   = 1.0
ctx-size         = 131072
reasoning        = on

[flint-40b-a2.5b-q4-256k-think]
hf               = unsloth/flint-GGUF:UD-Q4_K_XL
batch-size       = 8512
ubatch-size      = 8512
temp             = 1.0
top-p            = 0.95
top-k            = 20
min-p            = 0.00
repeat-penalty   = 1.0
ctx-size         = 262144
reasoning        = on
