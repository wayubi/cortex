services:

  llama-build:
    # docker compose --profile build build llama-build
    # Upstream ggml-org/llama.cpp at a pinned release tag (b12785 = commit
    # 55d4828, 2026-11-26, shortly after v1.1.0; previous pin b10622, 2026-08-25,
    # kept as image llama-cpp:b10622 for rollback). Bump LLAMA_REF + the tag
    # below deliberately and re-bench after.
    profiles: ["build"]
    build:
      context: ./llama-cpp
      dockerfile: Dockerfile
      args:
        BUILD_JOBS: "20"
        LLAMA_REPO: "https://github.com/ggml-org/llama.cpp.git"
        LLAMA_REF: "b12785"
      tags:
        - "llama-cpp:b12785"
    image: llama-cpp:latest

  llama-cpp:
    runtime: nvidia
    restart: unless-stopped
    image: llama-cpp:latest
    pull_policy: never
    networks:
      - cortex_network
    volumes:
      - llama-cpp_data:/root/.cache/huggingface
      - ./llama-cpp/models.ini:/models.ini
      # NVMe copies of the models loaded most (model-cache); same path everywhere
      - /opt/cortex-models:/opt/cortex-models:ro
      # slot-cache pruner, then llama-server (md/plan-slot-cache-across-swaps.md)
      - ./llama-cpp/slot-cache-entrypoint.sh:/usr/local/bin/slot-cache-entrypoint.sh:ro
    # Saved slots (KV cache + context checkpoints) of unloaded models, RAM only,
    # capped; emptied on every container start. Model weights never go here.
    tmpfs:
      - /slot-cache:size=8g
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - SLOT_CACHE_TTL_MIN=120
      - SLOT_CACHE_PRUNE_EVERY=300
      - SLOT_CACHE_KEEP_GB=6
    ulimits:
      memlock:
        soft: -1
        hard: -1
      core:
        soft: 0
        hard: 0
    entrypoint: ["/usr/local/bin/slot-cache-entrypoint.sh"]
    command:
      - "--models-preset"
      - "/models.ini"
      - "--port"
      - "8080"
      - "--host"
      - "0.0.0.0"

  prism-llama-build:
    # docker compose --profile build build prism-llama-build
    # PrismML's llama.cpp fork (ternary Bonsai kernels), same Dockerfile as
    # llama-build. Bump PRISM_REF to a newer prism-b* release tag deliberately.
    profiles: ["build"]
    build:
      context: ./llama-cpp
      dockerfile: Dockerfile
      args:
        BUILD_JOBS: "20"
        LLAMA_REPO: "https://github.com/PrismML-Eng/llama.cpp.git"
        LLAMA_REF: "prism-b12232-f702476"
        # The embedded web UI is off: its prebuilt download fails for fork tags
        # (it looks for an upstream release), and cortex never serves the UI.
        LLAMA_CMAKE_ARGS: "-DLLAMA_USE_PREBUILT_UI=OFF"
      tags:
        - "prism-llama-cpp:prism-b12232-f702476"
    image: prism-llama-cpp:latest

  prism-llama-cpp:
    # Served on openresty :8080 alongside llama-cpp; coordinator.lua routes a
    # request here when its model is a section of prism-llama-cpp/models.ini.
    runtime: nvidia
    restart: unless-stopped
    image: prism-llama-cpp:latest
    pull_policy: never
    networks:
      - cortex_network
    volumes:
      # the same HF cache as llama-cpp: one download serves both backends
      - llama-cpp_data:/root/.cache/huggingface
      - ./prism-llama-cpp/models.ini:/models.ini
      - /opt/cortex-models:/opt/cortex-models:ro
      # slot-cache pruner, then llama-server (md/plan-slot-cache-across-swaps.md)
      - ./llama-cpp/slot-cache-entrypoint.sh:/usr/local/bin/slot-cache-entrypoint.sh:ro
    # Saved slots (KV cache + context checkpoints) of unloaded models, RAM only,
    # capped; emptied on every container start. Model weights never go here.
    tmpfs:
      - /slot-cache:size=2g
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - SLOT_CACHE_TTL_MIN=120
      - SLOT_CACHE_PRUNE_EVERY=300
      - SLOT_CACHE_KEEP_GB=2
    ulimits:
      memlock:
        soft: -1
        hard: -1
      core:
        soft: 0
        hard: 0
    entrypoint: ["/usr/local/bin/slot-cache-entrypoint.sh"]
    command:
      - "--models-preset"
      - "/models.ini"
      - "--port"
      - "8080"
      - "--host"
      - "0.0.0.0"

  raon-llama-build:
    # docker compose --profile build build raon-llama-build
    # The llama.cpp build for KRAFTON Raon-1 mini: KRAFTON's fork, branch
    # raon-1-mini-preview (upstream ~b11729 + the `raon1` arch; upstream
    # support is pending). The branch has no release tags, so it is pinned by
    # commit (LLAMA_COMMIT). Bump the SHA and its tag only to re-bench Raon.
    profiles: ["build"]
    build:
      context: ./llama-cpp
      dockerfile: Dockerfile
      args:
        BUILD_JOBS: "20"
        LLAMA_REPO: "https://github.com/krafton-ai/llama.cpp.git"
        LLAMA_REF: "raon-1-mini-preview"
        LLAMA_COMMIT: "fb895662d25868756a19253ca5e0688f99b18994"
      tags:
        - "raon-llama-cpp:fb89566"
    image: raon-llama-cpp:latest

  raon-llama-cpp:
    # Served on openresty :8080 like prism-llama-cpp: a request whose model is
    # a section of raon-llama-cpp/models.ini is routed here (cortex.lua).
    # The Raon repo is gated: HF_TOKEN comes from compose.override.yml.
    runtime: nvidia
    restart: unless-stopped
    image: raon-llama-cpp:latest
    pull_policy: never
    networks:
      - cortex_network
    volumes:
      - llama-cpp_data:/root/.cache/huggingface
      - ./raon-llama-cpp/models.ini:/models.ini
      - /opt/cortex-models:/opt/cortex-models:ro
      # slot-cache pruner, then llama-server (md/plan-slot-cache-across-swaps.md)
      - ./llama-cpp/slot-cache-entrypoint.sh:/usr/local/bin/slot-cache-entrypoint.sh:ro
    # Saved slots (KV cache + context checkpoints) of unloaded models, RAM only,
    # capped; emptied on every container start. Model weights never go here.
    tmpfs:
      - /slot-cache:size=2g
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - SLOT_CACHE_TTL_MIN=120
      - SLOT_CACHE_PRUNE_EVERY=300
      - SLOT_CACHE_KEEP_GB=2
    ulimits:
      memlock:
        soft: -1
        hard: -1
      core:
        soft: 0
        hard: 0
    entrypoint: ["/usr/local/bin/slot-cache-entrypoint.sh"]
    command:
      - "--models-preset"
      - "/models.ini"
      - "--port"
      - "8080"
      - "--host"
      - "0.0.0.0"

  inkling-llama-build:
    # docker compose --profile build build inkling-llama-build
    # The llama.cpp build for Thinking Machines' Inkling 2 Mini: Unsloth's
    # prebuilt release b12651-mix-c7059d6 (upstream b12651 + 43 merged PRs:
    # the looped `inkling2` arch in Unsloth's GGUF layout, Inkling 2 DSpark
    # and attention fixes). That source exists only as the release's
    # tarball (the git tag of the same name is Unsloth's PR-list state, not
    # the merged source), so it is pinned by the tarball's sha256, from the
    # release's llama-prebuilt-sha256.json. Bump both together, then re-bench.
    # The embedded web UI is off: its prebuilt download is not covered by
    # the checksum, and cortex never serves it.
    profiles: ["build"]
    build:
      context: ./llama-cpp
      dockerfile: Dockerfile
      args:
        BUILD_JOBS: "20"
        LLAMA_TARBALL: "https://github.com/unslothai/llama.cpp/releases/download/b12651-mix-c7059d6/llama.cpp-source-b12651-mix-c7059d6.tar.gz"
        LLAMA_TARBALL_SHA256: "dedb1c001a6d4af567d9ea152f7fdd0a467cc04486021aa0f126d7dbe2375bb0"
        LLAMA_CMAKE_ARGS: "-DLLAMA_USE_PREBUILT_UI=OFF"
      tags:
        - "inkling-llama-cpp:b12651-mix-c7059d6"
    image: inkling-llama-cpp:latest

  inkling-llama-cpp:
    # Served on openresty :8080 like raon-llama-cpp: a request whose model is
    # a section of inkling-llama-cpp/models.ini is routed here (cortex.lua).
    runtime: nvidia
    restart: unless-stopped
    image: inkling-llama-cpp:latest
    pull_policy: never
    networks:
      - cortex_network
    volumes:
      - llama-cpp_data:/root/.cache/huggingface
      - ./inkling-llama-cpp/models.ini:/models.ini
      - /opt/cortex-models:/opt/cortex-models:ro
      # slot-cache pruner, then llama-server (md/plan-slot-cache-across-swaps.md)
      - ./llama-cpp/slot-cache-entrypoint.sh:/usr/local/bin/slot-cache-entrypoint.sh:ro
    # Saved slots (KV cache + context checkpoints) of unloaded models, RAM only,
    # capped; emptied on every container start. Model weights never go here.
    tmpfs:
      - /slot-cache:size=2g
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - SLOT_CACHE_TTL_MIN=120
      - SLOT_CACHE_PRUNE_EVERY=300
      - SLOT_CACHE_KEEP_GB=2
    ulimits:
      memlock:
        soft: -1
        hard: -1
      core:
        soft: 0
        hard: 0
    entrypoint: ["/usr/local/bin/slot-cache-entrypoint.sh"]
    command:
      - "--models-preset"
      - "/models.ini"
      - "--port"
      - "8080"
      - "--host"
      - "0.0.0.0"

  ollama:
    image: ollama/ollama
    restart: unless-stopped
    runtime: nvidia
    healthcheck:
      test: ollama --version || exit 1
    networks:
      - cortex_network
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_MAX_LOADED_MODELS=1

  nllb:
    build:
      context: ./nllb
      dockerfile: Dockerfile
    runtime: nvidia
    restart: unless-stopped
    networks:
      - cortex_network
    volumes:
      - nllb_data:/root/.cache/huggingface
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    ulimits:
      memlock:
        soft: -1
        hard: -1

  openresty:
    build:
      context: ./openresty
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "11434:11434"
      - "8080:8080"
      - "5002:5002"
    volumes:
      - ./openresty/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./openresty/coordinator.lua:/etc/nginx/lua/coordinator.lua
      # GET /availability, served on every port (see nginx.conf)
      - ./openresty/availability.lua:/etc/nginx/lua/availability.lua
      # human/bot policy (required by the other servers) and the log phase
      - ./openresty/cortex.lua:/etc/nginx/lua/cortex.lua
      - ./openresty/log.lua:/etc/nginx/lua/log.lua
      # GET /v1/models on :8080 — every llama.cpp router's list merged
      - ./openresty/models_list.lua:/etc/nginx/lua/models_list.lua
      # which :8080 models go to prism- / raon- / inkling-llama-cpp (their section names)
      - ./prism-llama-cpp/models.ini:/etc/nginx/prism-models.ini:ro
      - ./raon-llama-cpp/models.ini:/etc/nginx/raon-models.ini:ro
      - ./inkling-llama-cpp/models.ini:/etc/nginx/inkling-models.ini:ro
      # raw client tooling for `curl URL | sh` install workflows
      - ./openresty/scripts:/etc/nginx/scripts:ro
    # clients reach it on the published ports, or on a shared docker network
    # added per machine in compose.override.yml
    networks:
      - cortex_network

  # Keeps an NVMe copy of the GGUFs loaded most and serves them from there by
  # repointing their HF snapshot links (tools/model_cache.py). The SSD copy is
  # never touched. off: links back to the SSD, copies deleted, the service exits.
  model-cache:
    image: python:3.12-slim
    restart: on-failure
    init: true
    command: ["python", "-u", "/model_cache.py"]
    networks:
      - cortex_network
    volumes:
      - ./tools/model_cache.py:/model_cache.py:ro
      - llama-cpp_data:/root/.cache/huggingface
      - /opt/cortex-models:/opt/cortex-models
    environment:
      - CORTEX_NVME_CACHE=on              # on | off
      - CORTEX_NVME_CACHE_GB=128          # size cap for the NVMe copies
      - CORTEX_NVME_CACHE_LOADS=3         # copy a model on its Nth load ...
      - CORTEX_NVME_CACHE_DAYS=7          # ... within this many days
      - CORTEX_NVME_CACHE_DIR=/opt/cortex-models

  pi:
    build:
      context: ./pi
      dockerfile: Dockerfile
      args:
        # a new value reinstalls the latest agent: CACHEBUST=$(date +%s) docker compose build
        - CACHEBUST=${CACHEBUST:-0}
    image: pi:latest
    init: true
    restart: unless-stopped
    tty: true
    stdin_open: true
    working_dir: /workspace
    environment:
      - TERM=xterm-256color
      - CORTEX_URL=http://openresty:8080
      - OLLAMA_URL=http://openresty:11434
      - PI_MODELS_FILE=/root/.pi/agent/models.json
      # context Ollama serves a model without its own num_ctx (see models-common.sh)
      - CORTEX_OLLAMA_CTX=4096
      - PI_SYNC_MODELS=1
      - PI_SYNC_RETRIES=10
      - PI_SYNC_DELAY=3
      - CORTEX_GENERATE_MODELS=/opt/cortex-scripts/generate-models-pi.sh
    volumes:
      - pi_data:/root/.pi/agent
      - ./openresty/scripts:/opt/cortex-scripts:ro
    networks:
      - cortex_network

  opencode:
    build:
      context: ./opencode
      dockerfile: Dockerfile
      args:
        # a new value reinstalls the latest agent: CACHEBUST=$(date +%s) docker compose build
        - CACHEBUST=${CACHEBUST:-0}
    image: opencode:latest
    init: true
    restart: unless-stopped
    tty: true
    stdin_open: true
    working_dir: /workspace
    environment:
      - TERM=xterm-256color
      - CORTEX_URL=http://openresty:8080
      - OLLAMA_URL=http://openresty:11434
      - OPENCODE_CONFIG=/root/.config/opencode/opencode.json
      # context Ollama serves a model without its own num_ctx (see models-common.sh)
      - CORTEX_OLLAMA_CTX=4096
      - OPENCODE_SYNC_MODELS=1
      - OPENCODE_SYNC_RETRIES=10
      - OPENCODE_SYNC_DELAY=3
      - CORTEX_GENERATE_MODELS=/opt/cortex-scripts/generate-models-opencode.sh
    volumes:
      - opencode_data:/root/.config/opencode
      - ./openresty/scripts:/opt/cortex-scripts:ro
    networks:
      - cortex_network

volumes:
  ollama_data:
  llama-cpp_data:
  nllb_data:
  pi_data:
  opencode_data:

networks:
  cortex_network:
