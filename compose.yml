services:

  llama-build:
    # docker compose --profile build build llama-build
    # Upstream ggml-org/llama.cpp at a pinned release tag (b10622 = commit
    # 3737e41, 2026-08-25: the build serving cortex when pinning began). Bump
    # LLAMA_REF + the tag below deliberately and re-bench after.
    profiles: ["build"]
    build:
      context: ./llama-cpp
      dockerfile: Dockerfile
      args:
        BUILD_JOBS: "20"
        LLAMA_REPO: "https://github.com/ggml-org/llama.cpp.git"
        LLAMA_REF: "b10622"
      tags:
        - "llama-cpp:b10622"
    image: llama-cpp:latest

  llama-cpp:
    runtime: nvidia
    restart: unless-stopped
    image: llama-cpp:latest
    pull_policy: never
    networks:
      - cortex_network
    volumes:
      - llama-cpp_data:/root/.cache/huggingface
      - ./llama-cpp/models.ini:/models.ini
      # NVMe copies of the models loaded most (model-cache); same path everywhere
      - /opt/cortex-models:/opt/cortex-models:ro
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    ulimits:
      memlock:
        soft: -1
        hard: -1
      core:
        soft: 0
        hard: 0
    command:
      - "--models-preset"
      - "/models.ini"
      - "--port"
      - "8080"
      - "--host"
      - "0.0.0.0"

  prism-llama-build:
    # docker compose --profile build build prism-llama-build
    # PrismML's llama.cpp fork (ternary Bonsai kernels), same Dockerfile as
    # llama-build. Bump PRISM_REF to a newer prism-b* release tag deliberately.
    profiles: ["build"]
    build:
      context: ./llama-cpp
      dockerfile: Dockerfile
      args:
        BUILD_JOBS: "20"
        LLAMA_REPO: "https://github.com/PrismML-Eng/llama.cpp.git"
        LLAMA_REF: "prism-b10777-e3de715"
      tags:
        - "prism-llama-cpp:prism-b10777-e3de715"
    image: prism-llama-cpp:latest

  prism-llama-cpp:
    # Served on openresty :8080 alongside llama-cpp; coordinator.lua routes a
    # request here when its model is a section of prism-llama-cpp/models.ini.
    runtime: nvidia
    restart: unless-stopped
    image: prism-llama-cpp:latest
    pull_policy: never
    networks:
      - cortex_network
    volumes:
      # the same HF cache as llama-cpp: one download serves both backends
      - llama-cpp_data:/root/.cache/huggingface
      - ./prism-llama-cpp/models.ini:/models.ini
      - /opt/cortex-models:/opt/cortex-models:ro
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    ulimits:
      memlock:
        soft: -1
        hard: -1
      core:
        soft: 0
        hard: 0
    command:
      - "--models-preset"
      - "/models.ini"
      - "--port"
      - "8080"
      - "--host"
      - "0.0.0.0"

  ollama:
    image: ollama/ollama
    restart: unless-stopped
    runtime: nvidia
    healthcheck:
      test: ollama --version || exit 1
    networks:
      - cortex_network
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_MAX_LOADED_MODELS=1

  nllb:
    build:
      context: ./nllb
      dockerfile: Dockerfile
    runtime: nvidia
    restart: unless-stopped
    networks:
      - cortex_network
    volumes:
      - nllb_data:/root/.cache/huggingface
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    ulimits:
      memlock:
        soft: -1
        hard: -1

  openresty:
    build:
      context: ./openresty
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "11434:11434"
      - "8080:8080"
      - "5002:5002"
    volumes:
      - ./openresty/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./openresty/coordinator.lua:/etc/nginx/lua/coordinator.lua
      # GET /availability, served on all three ports (see nginx.conf)
      - ./openresty/availability.lua:/etc/nginx/lua/availability.lua
      # human/bot policy (required by the other three) and the log phase
      - ./openresty/cortex.lua:/etc/nginx/lua/cortex.lua
      - ./openresty/log.lua:/etc/nginx/lua/log.lua
      # GET /v1/models on :8080 — llama-cpp's and prism-llama-cpp's lists merged
      - ./openresty/models_list.lua:/etc/nginx/lua/models_list.lua
      # which :8080 models go to prism-llama-cpp (its section names)
      - ./prism-llama-cpp/models.ini:/etc/nginx/prism-models.ini:ro
    networks:
      - cortex_network
      - enhasa_network

  # Keeps an NVMe copy of the GGUFs loaded most and serves them from there by
  # repointing their HF snapshot links (tools/model_cache.py). The SSD copy is
  # never touched. off: links back to the SSD, copies deleted, the service exits.
  model-cache:
    image: python:3.12-slim
    restart: on-failure
    init: true
    command: ["python", "-u", "/model_cache.py"]
    networks:
      - cortex_network
    volumes:
      - ./tools/model_cache.py:/model_cache.py:ro
      - llama-cpp_data:/root/.cache/huggingface
      - /opt/cortex-models:/opt/cortex-models
    environment:
      - CORTEX_NVME_CACHE=on              # on | off
      - CORTEX_NVME_CACHE_GB=64           # size cap for the NVMe copies
      - CORTEX_NVME_CACHE_LOADS=3         # copy a model on its Nth load ...
      - CORTEX_NVME_CACHE_DAYS=7          # ... within this many days
      - CORTEX_NVME_CACHE_DIR=/opt/cortex-models

volumes:
  ollama_data:
  llama-cpp_data:
  nllb_data:

networks:
  cortex_network:
  enhasa_network:
    external: true
