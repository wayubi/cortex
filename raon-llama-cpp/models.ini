; ─────────────────────────────────────────────────────────────
; raon-llama-cpp — the llama.cpp build for KRAFTON Raon-1 mini (arch `raon1`,
; krafton-ai/llama.cpp raon-1-mini-preview; upstream support is pending;
; compose.yml raon-llama-build). No other router's build can load it, so Raon
; has its own router. NVIDIA GeForce RTX 3060 — VRAM = 12288MiB
;
; Served on openresty :8080 next to llama-cpp: coordinator.lua sends a request
; here when its model is a section name in THIS file, so every name must be
; unique across every router's models.ini.
; ─────────────────────────────────────────────────────────────

[*]
ngl              = -1
flash-attn       = true
jinja            = true
load-mode        = mmap+mlock
offline          = true
no-mmproj        = true
parallel         = 1
cont-batching    = true
threads          = 20
threads-batch    = 20
ctx-size         = 65536
batch-size       = 4096 ; batch-size should equal ubatch-size
ubatch-size      = 4096 ; adjust by 1024 / 512 / 256 / 128 / 64 increments
cache-type-k     = q4_0
cache-type-v     = q4_0

; ─────────────────────────────────────────────────────────────
; KRAFTON/Raon-1-mini-preview-gguf:Q4_K_M (19.7 GB, imatrix) — 28.8B-A4.3B MoE
; (128 experts, 6 + 1 shared active), 18 Raon Delta Attention + 7 MLA layers:
; only the MLA layers keep KV (~8 KiB/token BF16). Gated repo (HF_TOKEN).
; Built for thinking (the card advises against turning it off): -think only.
; Sampling per model card; presence 1.5 general, 0 for coding/math (-coder).
; No DFlash2 drafter: bench.sh tunes only draft-mtp.
; ─────────────────────────────────────────────────────────────

[raon-1-mini-q4-128k-think]
hf               = KRAFTON/Raon-1-mini-preview-gguf:Q4_K_M
batch-size       = 8000
ubatch-size      = 8000
temp             = 1.0
top-p            = 0.95
top-k            = 20
min-p            = 0.00
presence-penalty = 1.5
repeat-penalty   = 1.0
ctx-size         = 131072
reasoning        = on

[raon-1-mini-q4-128k-think-coder]
hf               = KRAFTON/Raon-1-mini-preview-gguf:Q4_K_M
batch-size       = 8000
ubatch-size      = 8000
temp             = 1.0
top-p            = 0.95
top-k            = 20
min-p            = 0.00
presence-penalty = 0.0
repeat-penalty   = 1.0
ctx-size         = 131072
reasoning        = on

