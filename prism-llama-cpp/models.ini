batch-size       = 512
ubatch-size      = 512
temp             = 0.7
top-p            = 0.80
top-k            = 20
min-p            = 0.00
presence-penalty = 1.5
repeat-penalty   = 1.0
ctx-size         = 65536
reasoning        = off

[bonsai-2-27b-ptq1-64k-think]
hf               = prism-ml/Ternary-Bonsai-2-27B-gguf:PTQ1_0
batch-size       = 512
ubatch-size      = 512
temp             = 1.0
top-p            = 0.95
top-k            = 20
min-p            = 0.05
presence-penalty = 0.0
repeat-penalty   = 1.0
ctx-size         = 65536
reasoning        = on
