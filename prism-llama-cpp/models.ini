; ─────────────────────────────────────────────────────────────
; ayshinko/Bonsai-2-27B-PTQ1_0-MTP-Uncensored-Ready-GGUF:PTQ1_0-MTP-Q8_0 (6.40 GB)
; Community merge: Prism's PTQ1_0 (dense trits) + ProCreations' Bonsai-trained
; MTP head (block 64, Q8_0) — the same head as the PQ2_0 entries above. The
; repo's optional LoRA (adapters/, "uncensored") is not used; the GGUF itself
; is the plain model. Replaces sudoingx's PTQ1_0-mtp-lean, which the fork's
; downloader treats as a separate drafter: any GGUF whose name contains
; lowercase "mtp-" is an MTP sidecar, so it loaded a second full copy for the
; draft and spilled to CPU (3.7 t/s, 955% CPU). Uppercase "-MTP-" is a model,
; and the head is built on the target ("creating MTP draft context").
; Plain PTQ1_0 A/B 2026-10-16 @ 64k, batch 512 (no MTP): 36.1 code / 36.9
; prose / 23.7 at 36K ctx, peak 7.1 GB.
; ─────────────────────────────────────────────────────────────

