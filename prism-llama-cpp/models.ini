; ─────────────────────────────────────────────────────────────
; prism-llama-cpp — PrismML's llama.cpp fork (ternary PQ2_0 / PTQ1_0 kernels,
; Hadamard activation runtime). Same router as llama-cpp, its own presets.
; NVIDIA GeForce RTX 3060 — VRAM = 12288MiB
;
; Served on openresty :8080 next to llama-cpp: coordinator.lua sends a request
; here when its model is a section name in THIS file, so every name must be
; unique across llama-cpp/models.ini and this file.
; ─────────────────────────────────────────────────────────────

[*]
ngl              = -1
flash-attn       = true
jinja            = true
no-mmap          = true
no-mmproj        = true
mlock            = true
parallel         = 1
cont-batching    = true
threads          = 20
threads-batch    = 20
ctx-size         = 65536
batch-size       = 4096 ; batch-size should equal ubatch-size
ubatch-size      = 4096 ; adjust by 1024 / 512 / 256 / 128 / 64 increments
cache-type-k     = q4_0
cache-type-v     = q4_0

; ─────────────────────────────────────────────────────────────
; ProCreations/Ternary-Bonsai-2-27B-MTP:PQ2_0-MTP-Q8_0 (7.66 GB)
; Community build: Prism's unchanged PQ2_0 target + a trained MTP layer (Q8_0)
; in the same file. Needs the fork's MTP fix (PR #205, in prism-b10777).
; A/B 2026-10-16 @ 64k, batch 512, n_max 2: decode 40.1 code / 36.2 prose /
; 32.1 at 36K ctx, prefill 458, peak 9.4 GB. Batch 512 is the A/B value, not
; yet tuned by bench.sh.
; ─────────────────────────────────────────────────────────────

[bonsai-2-27b-pq2-mtp-64k]
hf               = ProCreations/Ternary-Bonsai-2-27B-MTP:PQ2_0-MTP-Q8_0
batch-size       = 512
ubatch-size      = 512
temp             = 0.7
top-p            = 0.80
top-k            = 20
min-p            = 0.00
presence-penalty = 1.5
repeat-penalty   = 1.0
spec-type        = draft-mtp
spec-draft-n-max = 2
spec-draft-p-min = 0.7
ctx-size         = 65536
reasoning        = off

[bonsai-2-27b-pq2-mtp-64k-think]
hf               = ProCreations/Ternary-Bonsai-2-27B-MTP:PQ2_0-MTP-Q8_0
batch-size       = 512
ubatch-size      = 512
temp             = 1.0
top-p            = 0.95
top-k            = 20
min-p            = 0.05
presence-penalty = 0.0
repeat-penalty   = 1.0
spec-type        = draft-mtp
spec-draft-n-max = 2
spec-draft-p-min = 0.7
ctx-size         = 65536
reasoning        = on

; ─────────────────────────────────────────────────────────────
; prism-ml/Ternary-Bonsai-2-27B-gguf:PTQ1_0 (5.95 GB, dense trits, no MTP)
; A/B 2026-10-16 @ 64k, batch 512: decode 36.1 code / 36.9 prose / 23.7 at
; 36K ctx, prefill 483, peak 7.1 GB — the smallest footprint, most ctx headroom.
; ─────────────────────────────────────────────────────────────

[bonsai-2-27b-ptq1-64k]
